[project]
name = "devassist"
version = "0.1.0"
description = "A command-line assistant that documents and reviews Python snippets."
readme = "README.md"
authors = [
    { name = "Ethan Tran", email = "ethandt1028@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "bandit>=1.9.4",
    "httpx2>=2.13.1",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "ruff>=0.17.1",
    "typer>=0.27.3",
]

[project.scripts]
devassist = "devassist.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --cov=devassist --cov-fail-under=85"
markers = ["live: calls a real API and needs ANTHROPIC_API_KEY"]
