name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t devassist .
      - name: Show the version
        run: docker run --rm devassist --version
      - name: Check the container doesn't run as root
        run: test "$(docker run --rm --entrypoint id devassist -u)" != "0"
      - name: Run the README's command without a key
        # No key is set here, so devassist must read the shared file, then stop
        # with exit code 3 and the missing-key message: proof that the CLI runs
        # in the container and that no key is built into the image.
        run: |
          set +e
          docker run --rm -e ANTHROPIC_API_KEY -v "${PWD}:/work:ro" devassist \
            explain /work/src/devassist/metrics.py 2> stderr.txt
          code=$?
          set -e
          cat stderr.txt
          test "$code" -eq 3
          grep -q "ANTHROPIC_API_KEY is not set" stderr.txt

  pip:
    # The README's fallback for reviewers without uv: plain pip into a fresh
    # environment, resolving dependencies from PyPI rather than uv.lock.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Install uv, only to provide Python 3.13
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install with pip
        run: |
          uv venv --seed --python 3.13 /tmp/pip-env
          /tmp/pip-env/bin/python -m pip install .
      - name: Run the installed command
        run: /tmp/pip-env/bin/devassist --version
